name: Release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build — ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            binary: jinx
            archive_ext: tar.gz

          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            use_cross: true
            binary: jinx
            archive_ext: tar.gz

          - target: x86_64-apple-darwin
            runner: macos-13
            binary: jinx
            archive_ext: tar.gz

          - target: aarch64-apple-darwin
            runner: macos-latest
            binary: jinx
            archive_ext: tar.gz

          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            binary: jinx.exe
            archive_ext: zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      # cross compiles Linux aarch64 inside a Docker container that ships
      # the right cross-compiler and sysroot, which bundled rusqlite needs.
      - name: Install cross (Linux ARM64 only)
        if: matrix.use_cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build with cross
        if: matrix.use_cross
        run: cross build --release --target ${{ matrix.target }} --bin jinx

      - name: Build native
        if: '!matrix.use_cross'
        run: cargo build --release --target ${{ matrix.target }} --bin jinx

      # ── Linux / macOS packaging ──────────────────────────────────────────
      - name: Package (tar.gz)
        if: matrix.archive_ext == 'tar.gz'
        shell: bash
        run: |
          ARCHIVE="jinx-${{ github.ref_name }}-${{ matrix.target }}.tar.gz"
          tar -czf "$ARCHIVE" \
              -C "target/${{ matrix.target }}/release" \
              "${{ matrix.binary }}"
          shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      # ── Windows packaging ────────────────────────────────────────────────
      - name: Package (zip)
        if: matrix.archive_ext == 'zip'
        shell: pwsh
        run: |
          $archive = "jinx-${{ github.ref_name }}-${{ matrix.target }}.zip"
          Compress-Archive `
              -Path "target/${{ matrix.target }}/release/${{ matrix.binary }}" `
              -DestinationPath $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          "$hash  $archive" | Out-File "$archive.sha256" -Encoding ascii
          "ARCHIVE=$archive" >> $env:GITHUB_ENV

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256
