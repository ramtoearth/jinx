[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "jinx-agent"
version = "0.1.0"
description = "Agente de organización jinx."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Ramses Mata" },
]
dependencies = [
    "strands-agents[ollama,openai,anthropic,gemini,llamaapi]>=1.0,<2.0",
    "strands-agents-tools>=0.5,<0.6",
    "botocore[crt]>=1.29",
]

[project.scripts]
jinx-agent = "agent.main:main"

[project.optional-dependencies]
gcal = [
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.2",
    "google-auth>=2.20",
]
dev = [
    "hypothesis",
    "pytest",
    "ruff",
    "mypy",
]

[tool.hatch.build.targets.wheel]
packages = ["agent", "gcal_sync"]

[tool.pytest.ini_options]
testpaths = ["agent/tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["agent"]
mypy_path = "agent"
namespace_packages = true
explicit_package_bases = true
