[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "jinx-agent"
version = "0.1.0"
description = "Agente Python (Strands Agents) de jinx."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "jinx contributors" },
]
dependencies = [
    "strands-agents[ollama]>=1.0,<2.0",
    "strands-agents-tools>=0.5,<0.6",
]

[project.scripts]
jinx-agent = "agent.main:main"

[project.optional-dependencies]
dev = [
    "hypothesis",
    "pytest",
    "ruff",
    "mypy",
]

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[tool.pytest.ini_options]
testpaths = ["agent/tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
